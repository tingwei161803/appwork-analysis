<!doctype html>
<html lang="zh-Hant" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>AppWorks 投資組合圖鑑 · AppWorks Portfolio Atlas</title>
  <meta name="description" content="AppWorks 在台灣與大東南亞的投資組合互動圖鑑，支援中英切換、產業/地區/狀態多軸篩選與全文搜尋。An interactive bilingual atlas of AppWorks' portfolio across Taiwan & Greater Southeast Asia." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Flex:opsz,wght@8..144,400..700&family=Roboto+Mono:wght@400;500&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="assets/styles.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%230b57d0'/><text x='50' y='70' font-size='52' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='700'>AW</text></svg>" />
</head>
<body>
  <header class="appbar">
    <div class="appbar__brand">
      <span class="brand-mark">AW</span>
      <span>
        <span data-i18n="brand">AppWorks 投資組合圖鑑</span><br />
        <span class="brand-sub" data-i18n="brandSub">台灣 × 大東南亞 創投與加速器</span>
      </span>
    </div>

    <div class="seg" role="group" aria-label="Language">
      <button id="lang-zh" data-lang="zh" aria-pressed="true"><span class="lbl">中文</span></button>
      <button id="lang-en" data-lang="en" aria-pressed="false"><span class="lbl">EN</span></button>
    </div>
    <button class="icon-btn ripple-host" id="theme-toggle" aria-label="Toggle theme" title="切換深淺色">
      <span class="material-symbols-rounded" id="theme-icon">dark_mode</span>
    </button>
  </header>

  <section class="hero">
    <span class="hero__eyebrow"><span class="dot"></span><span data-i18n="eyebrow">整理自 AppWorks 官方資料與公開報導</span></span>
    <h1 data-i18n-html="heroTitle">AppWorks 投了哪些 <span class="grad">公司</span>？</h1>
    <p data-i18n="heroDesc">把 AppWorks 在台灣與大東南亞（GSEA）的投資組合整理成一份可搜尋、可篩選、可雙語切換的互動圖鑑。每家公司附上產業、地區、階段與目前狀態。</p>
    <div class="hero__stats">
      <div class="hero__stat"><b id="stat-companies">0</b><span data-i18n="statCompanies">收錄公司</span></div>
      <div class="hero__stat"><b id="stat-industries">0</b><span data-i18n="statIndustries">產業類別</span></div>
      <div class="hero__stat"><b id="stat-countries">0</b><span data-i18n="statCountries">涵蓋地區</span></div>
      <div class="hero__stat"><b id="stat-ipos">0</b><span data-i18n="statIPOs">已上市</span></div>
    </div>
  </section>

  <section class="controls">
    <div class="search ripple-host">
      <span class="material-symbols-rounded">search</span>
      <input id="search" type="search" autocomplete="off" />
      <button class="icon-btn search__clear" id="search-clear" aria-label="Clear">
        <span class="material-symbols-rounded">close</span>
      </button>
    </div>
    <div class="filter-row">
      <span class="filter-row__label" data-i18n="filterIndustry">產業</span>
      <div class="chips" id="chips-industry" role="group" aria-label="Industries"></div>
    </div>
    <div class="filter-row">
      <span class="filter-row__label" data-i18n="filterCountry">地區</span>
      <div class="chips" id="chips-country" role="group" aria-label="Countries"></div>
    </div>
    <div class="filter-row">
      <span class="filter-row__label" data-i18n="filterStatus">狀態</span>
      <div class="chips" id="chips-status" role="group" aria-label="Status"></div>
    </div>
    <div class="result-count" id="result-count" aria-live="polite"></div>
  </section>

  <main class="grid" id="grid" aria-live="polite"></main>
  <div class="load-sentinel" id="load-sentinel" hidden></div>

  <footer class="site-foot">
    <p data-i18n-html="footer">資料整理自 <a href="https://appworks.tw/investments/" target="_blank" rel="noopener">AppWorks Investments</a>、Crunchbase 與公開新聞。非官方整理，內容僅供研究參考。</p>
  </footer>

  <div class="scrim" id="scrim" role="dialog" aria-modal="true" aria-labelledby="dlg-title" hidden>
    <div class="dialog" id="dialog"></div>
  </div>

  <script src="data/portfolio.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
